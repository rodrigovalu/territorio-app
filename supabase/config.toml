# Configuração do Supabase CLI (desenvolvimento local e deploy das funções)
project_id = "territorio"

[api]
schemas = ["public"]
max_rows = 1000

[auth]
site_url = "territorio://"
enable_signup = true
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_signup = false

[auth.external.google]
enabled = true
# Web client ID primeiro, depois os Android client IDs (debug e release), separados por vírgula
client_id = "env(GOOGLE_CLIENT_IDS)"
secret = "env(GOOGLE_WEB_CLIENT_SECRET)"
skip_nonce_check = false

[functions.submit-run]
verify_jwt = true

[functions.delete-account]
verify_jwt = true
